name: Publish the catalog

# start_publish.yml, which bikebook calls on each push to its main, starts this. It runs here rather than as a workflow bikebook calls, so the
# R2 keys stay in this repo's catalog environment, which only main can deploy to. Whoever starts it can only publish
# bikebook's main: its one input only names the run
run-name: Publish the catalog for ${{ inputs.request }}

on:
  workflow_dispatch:
    inputs:
      request:
        description: The run that asked for this one, which finds it by this name to wait on it
        required: false

permissions:
  contents: read

concurrency:
  group: publish_catalog

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: catalog
    env:
      BIKEBOOK_DATA: ${{ github.workspace }}/bikebook
      CATALOG: ${{ github.workspace }}/catalog
      DESTINATION: s3://${{ vars.R2_CATALOG_BUCKET || 'bikebook-catalog' }}/catalog
      AWS_ENDPOINT_URL: ${{ vars.R2_ENDPOINT }}
      AWS_DEFAULT_REGION: auto
      # R2 rejects the checksums newer AWS CLIs send by default
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: git clone -q --depth 1 https://github.com/bikeindex/bikebook "$BIKEBOOK_DATA"
      - name: Install the pinned toolchain
        run: |
          version=$(awk '$1 == "rust" { print $2 }' .tool-versions)
          rustup toolchain install "$version" --profile minimal
          rustup default "$version"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # main can be ahead of the commit whose checks started this run
      - run: cargo test --release --locked --no-fail-fast
      - run: cargo build --release --locked --bin generate_catalog
      # The keys are only in the steps that use the bucket, not the ones that build or run code
      - name: Download the published catalog
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: aws s3 sync --only-show-errors "$DESTINATION" "$CATALOG"
      - run: target/release/generate_catalog "$CATALOG"
      # After the catalog, whose vocabulary names its values. It keeps the published viewer unless a schema changed, and
      # stops the publish on one Bike Index's viewer can't read
      - name: Generate the schema viewer
        run: target/release/generate_catalog "$CATALOG" --schema-viewer
      # A published version never changes
      - name: Upload the schemas
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_STOCK_PHOTOS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STOCK_PHOTOS_SECRET_ACCESS_KEY }}
          BUCKET: ${{ vars.R2_STOCK_PHOTOS_BUCKET || 'bikebook' }}
        run: |
          for schema in "$BIKEBOOK_DATA"/schemas/*.json; do
            key=$(jq -r '."$id" | sub("^https://[^/]+/"; "")' "$schema")
            aws s3api head-object --bucket "$BUCKET" --key "$key" &> /dev/null && continue
            aws s3 cp "$schema" "s3://$BUCKET/$key" --content-type application/schema+json \
              --cache-control "public, max-age=31536000, immutable"
          done
      # The new files go up before the manifests naming them, and expired ones, a dropped format's manifests among them,
      # are deleted after. Each is gzip but retired.json, and no-transform stops Cloudflare recompressing it worse for a
      # browser that takes brotli. Cloudflare keeps a manifest for s-maxage, which has to stay well under RETENTION in
      # generate_catalog: when the purge below fails, the edge goes on serving an old manifest, and the files it names
      # have to still be there
      - name: Upload the catalog
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          upload() { aws s3 "$@" --only-show-errors --content-type application/json; }
          upload sync "$CATALOG" "$DESTINATION" --exclude "manifest*.json" --exclude retired.json --content-encoding gzip \
            --cache-control "public, max-age=31536000, immutable, no-transform"
          for manifest in "$CATALOG"/manifest*.json; do
            upload cp "$manifest" "$DESTINATION/${manifest##*/}" --content-encoding gzip \
              --cache-control "public, max-age=60, s-maxage=3600, no-transform"
          done
          upload cp "$CATALOG/retired.json" "$DESTINATION/retired.json" --cache-control no-store
          aws s3 sync --only-show-errors --delete "$CATALOG" "$DESTINATION" --exclude retired.json
      # A purge by URL misses: see the Cache Rule in the README
      - name: Purge the manifests from Cloudflare's cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_TOKEN }}
          ZONE: ${{ vars.CLOUDFLARE_ZONE_ID }}
          CATALOG_URL: bikebook-catalog.bikeindex.org/catalog/
        run: |
          curl -sS --fail-with-body "https://api.cloudflare.com/client/v4/zones/$ZONE/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --json "{\"prefixes\": [\"${CATALOG_URL}manifest\"]}"
          cd "$CATALOG"
          for attempt in {1..12}; do
            sleep 5
            for manifest in manifest*.json; do
              curl -s -H "Accept-Encoding: gzip" "https://$CATALOG_URL$manifest" | cmp -s - "$manifest" || continue 2
            done
            exit 0
          done
          echo "::error::Cloudflare still serves an old $manifest a minute after the purge"
          exit 1
