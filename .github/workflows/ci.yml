name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    secrets:
      catalog_publish_token:
        description: Can start this repo's publish workflow, and nothing else
        required: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BIKEBOOK_DATA: ${{ github.workspace }}/bikebook
    steps:
      # A repository other than the one running the workflow checks out at its default branch: called from bikebook,
      # that's this repo's main over the commit under test; run here, this commit over bikebook's main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: bikeindex/bikebook_ci
      # The catalog is the slowest step, so it downloads while the checks install and compile
      - name: Start fetching the catalog
        env:
          REPOSITORY: ${{ github.repository == 'bikeindex/bikebook_ci' && 'bikeindex/bikebook' || github.repository }}
          REF: ${{ github.repository == 'bikeindex/bikebook_ci' && 'HEAD' || github.sha }}
        run: |
          git init -q "$BIKEBOOK_DATA"
          (git -C "$BIKEBOOK_DATA" fetch -q --depth 1 "https://github.com/$REPOSITORY" "$REF" \
            && git -C "$BIKEBOOK_DATA" checkout -q FETCH_HEAD; echo $? > "$RUNNER_TEMP/catalog_status") &
      - name: Install the pinned toolchain
        run: |
          version=$(awk '$1 == "rust" { print $2 }' .tool-versions)
          rustup toolchain install "$version" --profile minimal --component rustfmt,clippy
          rustup default "$version"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked --no-run
      - name: Wait for the catalog
        run: |
          until [ -f "$RUNNER_TEMP/catalog_status" ]; do sleep 1; done
          exit "$(cat "$RUNNER_TEMP/catalog_status")"
      - run: cargo test --locked --no-fail-fast

  # Starts the publish workflow, which runs in this repo with the R2 keys, and fails if the catalog doesn't publish
  publish:
    needs: test
    if: github.repository == 'bikeindex/bikebook' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Publish the catalog
        env:
          GH_TOKEN: ${{ secrets.catalog_publish_token }}
          GH_REPO: bikeindex/bikebook_ci
          REQUEST: ${{ github.sha }} (run ${{ github.run_id }}, attempt ${{ github.run_attempt }})
        run: |
          gh workflow run publish.yml --ref main -f request="$REQUEST"
          runs() { gh run list --workflow publish.yml --limit 50 --json databaseId,displayTitle --jq "$1"; }
          for attempt in $(seq 60); do
            run=$(runs 'map(select(.displayTitle == "Publish the catalog for " + env.REQUEST))[0].databaseId // empty')
            [ -n "$run" ] && break
            sleep 5
          done
          [ -n "$run" ] || { echo "The publish run didn't start"; exit 1; }
          until gh run watch "$run" --interval 30 --exit-status > /dev/null; do
            echo "https://github.com/$GH_REPO/actions/runs/$run"
            [ "$(gh run view "$run" --json conclusion --jq .conclusion)" = cancelled ] || exit 1
            # A later push's run replaces a queued one, and publishes this commit too
            run=$(runs "map(.databaseId | select(. > $run)) | min // empty")
            [ -n "$run" ] || exit 1
          done
