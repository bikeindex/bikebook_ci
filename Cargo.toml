[package]
name = "bikebook_data_checks"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
humantime = "2.4.0"
jsonschema = { version = "0.61.2", default-features = false, features = ["idna"] }
md-5 = "0.11.0"
rayon = "1.12.0"
regex = "1.13.2"
serde_json = { version = "1.0.154", features = ["preserve_order"] }

[profile.test]
opt-level = 3
debug = false
